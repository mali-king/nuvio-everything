<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Everything Looks III</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@100..900&family=Archivo:ital,wdth,wght@0,62..125,500..900;1,62..125,500..900&family=Fraunces:opsz,wght@9..144,500..700&family=Lilita+One&family=Caveat+Brush&display=swap">
<style>
/* Round 6: three more cover looks for the 78 Everything folders, built like styles.html.
   mono True Black Mono, app Showcase (a real streaming app's tiles); for the third slot (Stained Glass was
   turned down) candidates: vhs VHS Rental, film Lightbox, gallery Gallery (round 7); cine Movie Night, flap
   Split-Flap, sticker Sticker Pack, slate Slate (round 8).
   looks3.html#r-<style>-<folder key> draws one tile full-window for the exporter; window.setT(t) poses its
   hover loop at t in [0, 1), and t = 0 is the still. looks3.html?s=<style> draws every folder as a sheet. */
:root { color-scheme: dark; --sans: "Inter Tight", -apple-system, "Helvetica Neue", sans-serif; --cond: "Archivo", "Inter Tight", sans-serif; --disp: "Fraunces", Georgia, serif; --round: "Lilita One", "Arial Rounded MT Bold", sans-serif; --hand: "Caveat Brush", "Marker Felt", cursive; }
* { box-sizing: border-box; }
body { margin: 0; background: #000; color: #f2f2f4; font: 14px/1.4 var(--sans); }

.tile { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; container-type: inline-size; isolation: isolate; background: #000; color: #fff; }
.tile > * { position: absolute; }
.tile .fill { inset: 0; background-size: cover; background-position: center; }
.tile canvas.full { inset: 0; width: 100%; height: 100%; }
.tile .fit { white-space: nowrap; }
.tile .grain { inset: 0; filter: url(#grain); pointer-events: none; }
.tile img.logo { display: block; }
.flag { display: inline-block; flex: none; height: 3.2cqw; width: 4.8cqw; border-radius: .4cqw; background: linear-gradient(#111 0 30%, #fff 30% 36%, #c8102e 36% 64%, #fff 64% 70%, #007a3d 70%); box-shadow: 0 0 0 .14cqw rgba(255,255,255,.3); }

/* ── True Black Mono: the cast in silver, lit out of pure #000; white type ── */
.mono { background: #000; }
.mono canvas.full { transform: scale(var(--pz, 1)); transform-origin: 69% 55%; }
.mono .lab { left: 6cqw; bottom: 6.4cqw; display: flex; flex-direction: column; align-items: flex-start; gap: 2.6cqw; }
.mono .fit { font-family: var(--sans); font-weight: 600; letter-spacing: -.04em; line-height: .9; color: #fff; }
.mono img.logo { filter: brightness(0) invert(1); }
.mono .t10 { display: flex; align-items: flex-end; gap: 1.8cqw; margin-top: -1cqw; }
.mono .t10 i { font: 200 31cqw/.74 var(--sans); font-style: normal; letter-spacing: -.07em; color: #fff; margin-left: -1.2cqw; }
.mono .t10 b { display: flex; flex-direction: column; gap: 1.4cqw; padding-bottom: .6cqw; font: 600 5.2cqw/1 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: #fff; }
.mono .t10 b span + span { color: #8d8d8d; }
.mono .grain { opacity: .1; mix-blend-mode: overlay; }

/* ── Showcase: what a premium streaming app ships; true-colour key art, brand tiles, a Top 10 badge ── */
.app { background: #0b0c10; }
.app .img { inset: 0; background-image: var(--img); background-size: cover; background-position: var(--pos, center); transform: translate(var(--px, 0), 0) scale(var(--pz, 1)); transform-origin: var(--pos, center); }
.app .soft { inset: 0; background-image: var(--img); background-size: cover; background-position: var(--pos, center); filter: blur(2.6cqw) saturate(1.25) brightness(.78);
  -webkit-mask-image: linear-gradient(0deg, #000 0%, #000 18%, transparent 46%); mask-image: linear-gradient(0deg, #000 0%, #000 18%, transparent 46%); transform: scale(1.08); }
.app .shade { inset: 0; background: linear-gradient(0deg, rgba(6,7,11,.8) 0%, rgba(6,7,11,.42) 24%, rgba(6,7,11,0) 50%), linear-gradient(90deg, rgba(6,7,11,.38) 0%, rgba(6,7,11,0) 42%); }
.app .lab { left: 5.4cqw; bottom: 4.8cqw; display: flex; flex-direction: column; align-items: flex-start; gap: 2.4cqw; }
.app .fit { font-family: var(--sans); font-weight: 750; letter-spacing: -.035em; line-height: .92; color: #fff; text-shadow: 0 .2cqw 1.4cqw rgba(0,0,0,.35); }
.app .edge { inset: 0; box-shadow: inset 0 0 0 .16cqw rgba(255,255,255,.1), inset 0 .22cqw 0 rgba(255,255,255,.08); pointer-events: none; }
.app img.logo.white { filter: brightness(0) invert(1) drop-shadow(0 .3cqw 1.4cqw rgba(0,0,0,.35)); }
/* brand tiles: the service's colour over a dimmed still, the mark centred */
.app.svc .img { filter: grayscale(.45) brightness(.34) blur(.2cqw); transform: scale(1.04); }
.app .brand { inset: 0; mix-blend-mode: screen; background: radial-gradient(78% 105% at 50% 120%, color-mix(in srgb, var(--ac) 92%, transparent) 0%, color-mix(in srgb, var(--ac) 38%, transparent) 42%, transparent 74%),
  radial-gradient(70% 70% at 50% 42%, color-mix(in srgb, var(--ac) 18%, transparent) 0%, transparent 72%); }
.app .sheen { inset: 0; background: linear-gradient(118deg, rgba(255,255,255,.1) 0%, rgba(255,255,255,0) 34%); }
.app .mid { inset: 0; display: flex; align-items: center; justify-content: center; }
.app .mid .fit { font-weight: 800; letter-spacing: -.045em; text-align: center; line-height: .9; }
/* Top 10 */
.app.top .shade { background: linear-gradient(90deg, rgba(6,7,11,.86) 0%, rgba(6,7,11,.55) 34%, rgba(6,7,11,0) 62%), linear-gradient(0deg, rgba(6,7,11,.5) 0%, rgba(6,7,11,0) 40%); }
.app .t10 { display: flex; align-items: center; gap: 2.6cqw; }
.app .badge { width: 17cqw; height: 17cqw; border-radius: 1.4cqw; background: linear-gradient(160deg, color-mix(in srgb, var(--ac) 88%, #fff) 0%, var(--ac) 40%, color-mix(in srgb, var(--ac) 70%, #000) 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 .6cqw 2cqw rgba(0,0,0,.45), inset 0 .2cqw 0 rgba(255,255,255,.25); color: #fff; }
.app .badge b { font: 800 4cqw/1 var(--sans); letter-spacing: .14em; margin-left: .14em; }
.app .badge i { font: 900 10cqw/.86 var(--sans); font-style: normal; letter-spacing: -.05em; }
.app .when .flag { height: 4.4cqw; width: 6.6cqw; }
.app .when { display: flex; align-items: center; gap: 1.6cqw; font: 750 8cqw/1 var(--sans); letter-spacing: -.03em; color: #fff; }

/* ── VHS Rental: the film on a store-bought tape; chrome title on the label, reels turning in the window ── */
.vhs { background: #120d0b; }
.vhs .bg { inset: 0; background: radial-gradient(85% 95% at 28% 0%, #3b2b21 0%, #1b130f 55%, #0c0807 100%); }
.vhs .cas { left: 3.4cqw; top: 3cqw; width: 93.2cqw; height: 50.2cqw; transform: rotate(-1.2deg); }
.vhs .cas > * { position: absolute; }
.vhs .shell { inset: 0; border-radius: 1.4cqw; background: linear-gradient(175deg, #2b2b30 0%, #151517 42%, #0b0b0c 100%);
  box-shadow: 0 1.6cqw 3cqw rgba(0,0,0,.7), inset 0 .25cqw 0 rgba(255,255,255,.13), inset 0 -.3cqw 0 rgba(0,0,0,.6); }
.vhs .shell::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 .2cqw, transparent .2cqw .5cqw); }
.vhs .label { left: 3.4cqw; top: 2.8cqw; width: 86.4cqw; height: 31.4cqw; border-radius: .5cqw; overflow: hidden; background: #f3eee2; box-shadow: 0 .2cqw .4cqw rgba(0,0,0,.5); }
.vhs .label > * { position: absolute; }
.vhs .ph { inset: .5cqw; border-radius: .25cqw; background-image: var(--img); background-size: cover; background-position: var(--pos, center); filter: saturate(1.2) contrast(1.08); }
.vhs .lsh { inset: .5cqw; border-radius: .25cqw; background: linear-gradient(72deg, rgba(4,6,20,.8) 0%, rgba(4,6,20,.42) 36%, rgba(4,6,20,0) 60%); }
.vhs .band { left: .5cqw; right: .5cqw; height: 4cqw; top: var(--band, -10cqw); background: repeating-linear-gradient(180deg, rgba(255,255,255,0) 0 .3cqw, rgba(255,255,255,.28) .3cqw .42cqw), linear-gradient(180deg, transparent, rgba(255,255,255,.14), transparent); mix-blend-mode: screen; }
.vhs .ttl { left: 3.4cqw; bottom: 2.8cqw; display: flex; flex-direction: column; align-items: flex-start; gap: 1.4cqw; }
.vhs .chrome { position: relative; }
.vhs .chrome > div { white-space: nowrap; font-family: var(--cond); font-weight: 900; font-style: italic; font-stretch: 92%; text-transform: uppercase; line-height: .9; letter-spacing: -.01em; }
.vhs .chrome.nc > div { text-transform: none; }
.vhs .chrome .sh { color: #0a1030; }
.vhs .chrome .fg { position: absolute; inset: 0; color: transparent; -webkit-background-clip: text; background-clip: text;
  background-image: linear-gradient(180deg, #ffffff 0%, #e2ebff 36%, #7d96d8 48%, #16205a 51%, color-mix(in srgb, var(--ac) 60%, #fff) 70%, #ffffff 100%); }
.vhs img.logo { filter: brightness(0) invert(1) drop-shadow(.25cqw .3cqw 0 #0a1030) drop-shadow(0 .4cqw .8cqw rgba(0,0,0,.6)); }
.vhs .win { left: 22cqw; top: 36.4cqw; width: 49cqw; height: 11cqw; border-radius: .8cqw; overflow: hidden; background: linear-gradient(180deg, #1d1d21, #0e0e10); box-shadow: inset 0 .3cqw .8cqw rgba(0,0,0,.9), 0 0 0 .3cqw #09090a, 0 .15cqw 0 .35cqw rgba(255,255,255,.06); }
.vhs .win svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.vhs .win::after { content: ""; position: absolute; inset: 0; background: linear-gradient(165deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 38%); }
.vhs .mark { font: 800 2.3cqw/1 var(--cond); font-stretch: 80%; letter-spacing: .14em; color: #46464d; text-shadow: 0 .12cqw 0 rgba(255,255,255,.07); }
.vhs .screw { width: 1.5cqw; height: 1.5cqw; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #5a5a60 0%, #232326 60%, #111 100%); }
.vhs .sticker { left: 76cqw; top: 35.4cqw; width: 13.4cqw; height: 13.4cqw; border-radius: 50%; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--st) 70%, #fff) 0%, var(--st) 55%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .4cqw;
  color: #141414; font-family: var(--cond); text-transform: uppercase; box-shadow: 0 .3cqw .6cqw rgba(0,0,0,.5); transform: rotate(-12deg); }
.vhs .sticker b { font-weight: 800; font-size: 2.2cqw; line-height: 1; letter-spacing: .08em; }
.vhs .sticker i { font-style: normal; font-weight: 900; font-size: 3.2cqw; line-height: 1; font-stretch: 78%; }
.vhs .burst { left: 64cqw; top: -2.6cqw; width: 24cqw; height: 24cqw; background: var(--st); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #141414; transform: rotate(10deg);
  clip-path: polygon(50% 0%, 57% 13%, 69% 4%, 71% 19%, 85% 15%, 81% 29%, 96% 31%, 87% 43%, 100% 50%, 87% 57%, 96% 69%, 81% 71%, 85% 85%, 71% 81%, 69% 96%, 57% 87%, 50% 100%, 43% 87%, 31% 96%, 29% 81%, 15% 85%, 19% 71%, 4% 69%, 13% 57%, 0% 50%, 13% 43%, 4% 31%, 19% 29%, 15% 15%, 29% 19%, 31% 4%, 43% 13%);
  filter: drop-shadow(0 .3cqw .4cqw rgba(0,0,0,.45)); }
.vhs .burst b { font: 900 4.4cqw/.9 var(--cond); font-stretch: 80%; }
.vhs .burst i { font: 900 10.5cqw/.82 var(--cond); font-style: italic; font-stretch: 75%; }
.vhs .grain { opacity: .12; mix-blend-mode: overlay; }

/* ── Lightbox: the film as a strip of slides on a light table, a loupe on the frame that matters ── */
.film { background: #eef1f4; color: #111; }
.film .box { inset: 0; background: radial-gradient(95% 120% at 50% 38%, #ffffff 0%, #f4f6f9 50%, #dde2e8 100%); }
.film .strip { left: -6cqw; top: 2.2cqw; width: 112cqw; height: 36cqw; background: #151111; transform: rotate(var(--rot, -3deg)); box-shadow: 0 .5cqw 1.4cqw rgba(30,40,60,.28); }
.film .strip > * { position: absolute; }
.film .perf { left: 0; right: 0; height: 2.5cqw; background-image: repeating-linear-gradient(90deg, transparent 0 1.5cqw, #f7f9fc 1.5cqw 3.4cqw, transparent 3.4cqw 4.9cqw); }
.film .edge { left: 6cqw; font: 700 1.25cqw/1 var(--cond); letter-spacing: .32em; color: #e9a53b; white-space: nowrap; word-spacing: 8cqw; opacity: .9; }
.film .fr { top: 5.65cqw; width: 37cqw; height: 24.7cqw; background-size: cover; background-position: var(--pos, center); border-radius: .3cqw; filter: saturate(1.12) contrast(1.05); box-shadow: inset 0 0 1.2cqw rgba(0,0,0,.35); }
.film svg.grease { left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
.film .loupe { width: 22cqw; height: 22cqw; border-radius: 50%; background: conic-gradient(from 200deg, #8d9096, #f4f5f7, #9a9da3 30%, #e6e8eb 50%, #7c7f85 70%, #f0f1f3 85%, #8d9096);
  box-shadow: 0 1.6cqw 2.8cqw rgba(20,30,50,.4), 0 .3cqw .6cqw rgba(0,0,0,.3), inset 0 0 0 .2cqw rgba(0,0,0,.35); }
.film .lens { position: absolute; inset: .9cqw; border-radius: 50%; background-image: var(--img); background-repeat: no-repeat; filter: saturate(1.12) contrast(1.05); box-shadow: inset 0 0 1.6cqw rgba(0,0,0,.55); }
.film .glint { position: absolute; inset: .9cqw; border-radius: 50%; background: radial-gradient(60% 45% at 32% 22%, rgba(255,255,255,.38) 0%, rgba(255,255,255,0) 70%); }
.film .lab { left: 5cqw; bottom: 4.2cqw; display: flex; flex-direction: column; align-items: flex-start; gap: 1.8cqw; }
.film.top .lab { flex-direction: row; align-items: center; gap: 3cqw; }
.film .dymo { position: relative; padding: 1.15cqw 2.3cqw 1.25cqw; border-radius: .35cqw; transform: rotate(-1.4deg);
  background: linear-gradient(180deg, color-mix(in srgb, var(--tape) 80%, #fff) 0%, var(--tape) 30%, color-mix(in srgb, var(--tape) 82%, #000) 100%); box-shadow: 0 .35cqw .7cqw rgba(20,30,50,.3); }
.film .dymo .fit, .film .dymo .t { font-family: var(--cond); font-weight: 800; font-stretch: 80%; text-transform: uppercase; letter-spacing: .14em; color: #f6f6f0; line-height: 1;
  text-shadow: 0 -.14cqw 0 rgba(0,0,0,.4), 0 .14cqw 0 rgba(255,255,255,.3); }
.film .dymo .t { font-size: 6.4cqw; display: flex; align-items: center; gap: 1.6cqw; white-space: nowrap; }
.film img.logo { filter: brightness(0); }

/* ── Gallery: the still as an oil painting in a gilt frame, hung on a coloured museum wall ── */
.gallery { background: var(--wall); }
.gallery .wall { inset: 0; background: radial-gradient(40% 75% at 70% 4%, rgba(255,224,170,calc(.32 * var(--li, 1))) 0%, rgba(255,214,160,calc(.1 * var(--li, 1))) 50%, transparent 78%),
  radial-gradient(140% 130% at 45% 35%, transparent 45%, rgba(0,0,0,.5) 100%), var(--wall); }
.gallery .grain { opacity: .2; mix-blend-mode: overlay; }
.gallery .frame { left: 45cqw; top: 9cqw; width: 50cqw; height: 39.5cqw;
  background: linear-gradient(135deg, rgba(255,255,255,0) 0 38%, rgba(255,250,225,.22) 50%, rgba(255,255,255,0) 62%),
    repeating-linear-gradient(45deg, rgba(90,60,15,.22) 0 .32cqw, transparent .32cqw .9cqw),
    linear-gradient(135deg, #7a5a22 0%, #e9cd7e 22%, #a37d34 40%, #f0d68e 58%, #8a6826 78%, #5c4317 100%);
  box-shadow: 0 2.4cqw 3.8cqw rgba(0,0,0,.55), 0 .5cqw .9cqw rgba(0,0,0,.4), inset 0 0 0 .25cqw rgba(255,236,180,.55), inset 0 0 0 .6cqw rgba(90,62,18,.5), inset .5cqw .5cqw .9cqw rgba(255,248,220,.45), inset -.5cqw -.5cqw .9cqw rgba(40,25,5,.6); }
.gallery .frame > * { position: absolute; }
.gallery .liner { inset: 2.5cqw; background: #e8dfc7; box-shadow: inset 0 0 0 .15cqw rgba(0,0,0,.25), inset .3cqw .3cqw .6cqw rgba(0,0,0,.25); }
.gallery canvas.paint { left: 3.3cqw; top: 3.3cqw; width: calc(100% - 6.6cqw); height: calc(100% - 6.6cqw); }
.gallery .varnish { left: 3.3cqw; top: 3.3cqw; right: 3.3cqw; bottom: 3.3cqw; background: linear-gradient(115deg, transparent 35%, rgba(255,250,235,.16) 47%, transparent 58%); background-size: 300% 100%; background-repeat: no-repeat; background-position: var(--vs, 130%) 0; mix-blend-mode: screen; }
.gallery .lamp { left: 60.5cqw; top: 2.4cqw; width: 19cqw; height: 1.7cqw; border-radius: .85cqw; background: linear-gradient(180deg, #f0d892, #8a6a2a); box-shadow: 0 .5cqw .9cqw rgba(0,0,0,.45); }
.gallery .lamp::after { content: ""; position: absolute; left: 50%; top: 1.5cqw; width: .7cqw; height: 5.2cqw; transform: translateX(-50%); background: linear-gradient(90deg, #6e5220, #d9b866, #6e5220); }
.gallery .lab { left: 6cqw; top: 9cqw; bottom: 10.2cqw; width: 36cqw; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; gap: 2.4cqw; }
.gallery .rule { position: static; width: 7cqw; height: .32cqw; background: #d9b56c; }
.gallery .fit { font-family: var(--disp); font-weight: 600; font-variation-settings: "opsz" 144; letter-spacing: -.02em; line-height: .95; color: #f6ecd8; }
.gallery img.logo { filter: brightness(0) invert(.93) sepia(.25); }
.gallery .t10 { font: 600 13cqw/.88 var(--disp); font-variation-settings: "opsz" 144; letter-spacing: -.02em; color: #f6ecd8; }
.gallery .when { font: italic 500 5.4cqw/1 var(--disp); color: #d9b56c; display: flex; align-items: center; gap: 1.4cqw; }

/* ── Movie Night: the still on a cinema screen between velvet curtains, the audience in silhouette ── */
.cine { background: #080304; }
.cine .room { inset: 0; background: radial-gradient(75% 85% at 50% 32%, color-mix(in srgb, var(--glow, #888) 30%, transparent) 0%, transparent 72%), linear-gradient(180deg, #13070a 0%, #060203 100%); }
.cine .scr { left: 15.5cqw; top: 8cqw; width: 69cqw; height: 34.5cqw; box-shadow: 0 0 0 .45cqw #040102, 0 0 6cqw color-mix(in srgb, var(--glow, #888) 50%, transparent); overflow: hidden; }
.cine .scr .ph { position: absolute; inset: 0; background-image: var(--img); background-size: cover; background-position: var(--pos, center); filter: brightness(var(--fl, 1)) saturate(1.06); }
.cine .scr::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,.66) 0%, rgba(0,0,0,.18) 42%, rgba(0,0,0,0) 62%), radial-gradient(130% 130% at 50% 45%, transparent 55%, rgba(0,0,0,.35) 100%); }
.cine .dust { left: 15.5cqw; top: 8cqw; width: 69cqw; height: 34.5cqw; mix-blend-mode: screen; opacity: .55; background-position: 0 var(--dy, 0);
  background-image: radial-gradient(circle at 12% 20%, rgba(255,255,255,.7) 0 .1cqw, transparent .2cqw), radial-gradient(circle at 37% 66%, rgba(255,255,255,.55) 0 .08cqw, transparent .18cqw),
    radial-gradient(circle at 58% 34%, rgba(255,255,255,.6) 0 .12cqw, transparent .22cqw), radial-gradient(circle at 81% 78%, rgba(255,255,255,.5) 0 .09cqw, transparent .18cqw), radial-gradient(circle at 70% 10%, rgba(255,255,255,.45) 0 .07cqw, transparent .16cqw);
  background-size: 23cqw 11.5cqw; }
.cine .cap { left: 19.5cqw; bottom: 18cqw; display: flex; flex-direction: column; align-items: flex-start; gap: 1.4cqw; }
.cine .fit, .cine .t10 { font-family: var(--cond); font-weight: 800; font-stretch: 125%; text-transform: uppercase; letter-spacing: .07em; line-height: .98; color: #fff; text-shadow: 0 .3cqw 1.2cqw rgba(0,0,0,.6); }
.cine .t10 { font-size: 7cqw; display: flex; align-items: center; gap: 1.6cqw; white-space: nowrap; }
.cine .t10 span { font-size: .5em; letter-spacing: .2em; color: rgba(255,255,255,.82); }
.cine img.logo { filter: brightness(0) invert(1) drop-shadow(0 .3cqw 1cqw rgba(0,0,0,.6)); }
.cine .cur { top: 0; bottom: 0; width: 18cqw; background: linear-gradient(90deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 55%, color-mix(in srgb, var(--glow, #888) 26%, transparent) 100%), linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%),
    repeating-linear-gradient(90deg, #3a050c 0, #7a0f20 1.3cqw, #a51a30 1.9cqw, #5c0914 2.9cqw, #2a0307 3.5cqw); clip-path: polygon(0 0, 100% 0, 94% 30%, 80% 62%, 58% 100%, 0 100%); }

/* ── measuring and fitting ── */
function measure(el, text, stretch) {
  const m = document.createElement('span');
  m.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font-size:100px;left:0;top:0;line-height:1';
  if (stretch) m.style.fontStretch = stretch + '%';
  m.textContent = text;
  el.appendChild(m);
  const w = m.getBoundingClientRect().width;
  m.remove();
  return w;
}
// Largest size at which text fits a box (cqw), trying one line and the best two-line split.
function fitBox(el, text, bw, bh, lh, cap = 999) {
  const opts = [{ lines: [text], wd: measure(el, text) }];
  const words = text.split(' ');
  if (words.length > 1) {
    let b2 = null;
    for (let k = 1; k < words.length; k++) {
      const a = words.slice(0, k).join(' '), b = words.slice(k).join(' ');
      const wd = Math.max(measure(el, a), measure(el, b));
      if (!b2 || wd < b2.wd) b2 = { lines: [a, b], wd };
    }
    opts.push(b2);
  }
  let best = null;
  for (const o of opts) {
    const sz = Math.min(cap, bw * 100 / o.wd, bh / (o.lines.length * lh));
    const score = sz * (o.lines.length === 1 ? 1.06 : 1);
    if (!best || score > best.score) best = { score, size: sz, lines: o.lines };
  }
  return best;
}
function fitAll(t) {
  t.querySelectorAll('.fit[data-box]').forEach(el => {
    const [bw, bh] = el.dataset.box.split(',').map(Number);
    const fit = fitBox(el, el.dataset.text, bw, bh, +el.dataset.lh, el.dataset.cap ? +el.dataset.cap : 999);
    el.innerHTML = fit.lines.map(esc).join('<br>');
    el.style.fontSize = fit.size.toFixed(2) + 'cqw';
  });
}

  'mono-svc': { area: 640, h: 17, w: 40 }, 'mono-top': { area: 270, h: 10.5, w: 30 },
  'app-svc': { area: 860, h: 22, w: 52 }, 'app-top': { area: 330, h: 11, w: 34 },

  'gal-svc': { area: 440, h: 16, w: 34 }, 'gal-top': { area: 190, h: 9, w: 28 },
  'cine-svc': { area: 300, h: 11, w: 40 }, 'cine-top': { area: 120, h: 5.6, w: 20 }, 'flap-top': { area: 170, h: 7.5, w: 26 },
  'stk-logo': { area: 150, h: 7, w: 24 }, 'stk-svc': { area: 330, h: 12, w: 40 }, 'slate-top': { area: 110, h: 7, w: 16 }, 'slate-svc': { area: 300, h: 11, w: 44 },

async function logoSize(src, area, h, w) {

/* ── per-style finishing ── */
const B = {};

// Mono: the still in neutral grey, its subject (the Vision cut-out) at full strength and the rest of the scene
// sunk to a trace that falls off to true black, so the left of the tile, where the type sits, is #000.
// The subject is moved to the right third; with no backdrop to keep, it can go anywhere.
B.mono = async (t, key) => {
  const i = info(key);
  fitAll(t);
  const cv = t.querySelector('canvas.full');
  const [W, H] = size(cv);
  const im = await load(A + i.p.still), cm = i.p.cut ? await load(A + i.p.cut) : null;
  const sub = !!cm && i.p.area > .02;
  const iw = im.naturalWidth, ih = im.naturalHeight;
  const [bx, by, bw, bh] = i.p.box.map(v => v / 100);
  const cx = (FX[key] ?? i.p.box[0] + i.p.box[2] / 2) / 100;
  const cover = Math.max(W / iw, H / ih);
  // a Top 10 lockup is wider than a name, so its subject sits further right
  const CX = i.top ? .76 : .72, F0 = i.top ? .44 : .34, F1 = i.top ? .68 : .6;
  let sc, ox, oy;
  if (sub) {
    sc = clamp(H * .96 / (bh * ih), cover * .92, cover * 1.7);
    ox = W * CX - cx * iw * sc;
    oy = by + bh > .95 ? H - (by + bh) * ih * sc : H * .5 - (by + bh * .5) * ih * sc;
  } else {
    // no cut-out: the whole still, pushed right, fading in from the left
    sc = cover * 1.08; ox = W * 1.02 - iw * sc; oy = (H - ih * sc) / 2;
  }
  const dw = iw * sc, dh = ih * sc;
  const px = grab(im, W, H, ox, oy, dw, dh);
  const mk = sub ? grab(cm, W, H, ox, oy, dw, dh, `blur(${(W * .0022).toFixed(2)}px)`) : null;
  const N = W * H, L = new Float32Array(N), Ms = new Float32Array(N), hist = new Uint32Array(256);
  let cnt = 0;
  for (let n = 0; n < N; n++) {
    L[n] = .2126 * px[n * 4] + .7152 * px[n * 4 + 1] + .0722 * px[n * 4 + 2];
    Ms[n] = mk ? mk[n * 4 + 3] / 255 : 0;
    if (px[n * 4 + 3] > 200 && (!sub || Ms[n] > .5)) { hist[L[n] | 0]++; cnt++; }
  }
  // tones stretched over the subject's own range, then an S-curve; a dark still is lifted
  let acc = 0, lo = 0, hi = 255;
  for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc < cnt * .01) lo = v; if (acc < cnt * .992) hi = v; }
  const gam = clamp((i.p.lum || .3) / .34, .62, 1);
  const env = sub ? (i.p.area < .05 ? .42 : .17) : .9;
  const rx = Math.max(bw * dw * .85, W * .3), ry = Math.max(bh * dh * .75, H * .55), cyy = oy + (by + bh * .45) * dh;
  const G = new Float32Array(N), Mk = new Float32Array(N);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const n = y * W + x;
    if (px[n * 4 + 3] < 8) continue;
    let g = clamp((L[n] - lo) / Math.max(1, hi - lo), 0, 1) ** gam;
    G[n] = .72 * ss(0, 1, g) + .28 * g;
    const u = x / W;
    const edge = clamp(Math.min(x - ox, ox + dw - x, y - oy, oy + dh - y) / (W * .1), 0, 1);
    const r = Math.hypot((x - W * CX) / rx, (y - cyy) / ry);
    const v = y / H, rim = sub ? 1 - ss(.3, 1.1, r) : ss(0, .2, v) * ss(0, .2, 1 - v) * ss(0, .14, 1 - u);
    const scene = env * rim * ss(F0 + .02, F1 + .1, u) * edge;
    // the corner the type sits in is kept black, whatever the cast does
    const shade = i.top ? 1 - ss(.4, .62, u) : (1 - ss(.3, .52, u)) * ss(.3, .6, v);
    Mk[n] = Math.max(Ms[n] * ss(F0, F1, u), scene) * (1 - .92 * shade);
  }
  t._mono = { W, H, G, Mk, Ms, ctx: cv.getContext('2d') };
};
function paintMono(el, t) {
  const s = el._mono; if (!s) return;
  const { W, H, G, Mk, Ms, ctx } = s;
  const out = ctx.createImageData(W, H), o = out.data;
  // hover: a soft band of light crosses the subject; it is off-frame at t = 0 and t = 1
  const p = -.45 + 1.9 * t;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const n = y * W + x;
    let v = G[n] * Mk[n];
    if (t) { const d = x / W - y / H * .4 - p; v = v * (1 + .7 * Ms[n] * Math.exp(-d * d / .014)) + .06 * Ms[n] * Math.exp(-d * d / .004); }

    o[n * 4] = o[n * 4 + 1] = o[n * 4 + 2] = c; o[n * 4 + 3] = 255;

  const c = crop(im, W, H, fx, fy, 1.06);
  const src = grab(im, W, H, c.x, c.y, c.w, c.h);
  const r = Math.max(2, Math.round(W / 95)), W1 = W + 1, N1 = W1 * (H + 1);
  const S = [0, 1, 2, 3].map(() => new Float64Array(N1)), Q = new Float64Array(N1);
  for (let y = 0; y < H; y++) {
    const rs = [0, 0, 0, 0], rq = [0];
    for (let x = 0; x < W; x++) {
      const n = (y * W + x) * 4, L = .2126 * src[n] + .7152 * src[n + 1] + .0722 * src[n + 2];
      rs[0] += src[n]; rs[1] += src[n + 1]; rs[2] += src[n + 2]; rs[3] += L; rq[0] += L * L;
      const m = (y + 1) * W1 + x + 1, up = y * W1 + x + 1;
      for (let k = 0; k < 4; k++) S[k][m] = S[k][up] + rs[k];

  }
  const box = (A2, x0, y0, x1, y1) => A2[y1 * W1 + x1] - A2[y0 * W1 + x1] - A2[y1 * W1 + x0] + A2[y0 * W1 + x0];

    for (const [qx, qy] of [[-1, -1], [0, -1], [-1, 0], [0, 0]]) {

      const a = (x1 - x0) * (y1 - y0); if (!a) continue;

    o[n * 4 + 1] = clamp((m + (g0 - m) * 1.12) * 1.0 * f, 0, 255);
    o[n * 4 + 2] = clamp((m + (b0 - m) * 1.12) * .9 * f, 0, 255);

  const cp = document.createElement('canvas'); cp.width = W; cp.height = H; cp.getContext('2d').drawImage(cv, 0, 0);
  ctx.save(); ctx.globalAlpha = .5; ctx.filter = `blur(${(r * .45).toFixed(2)}px)`; ctx.drawImage(cp, 0, 0); ctx.restore();
};

// Movie Night: the room takes its light from the picture on the screen
B.cine = async (t, key) => {
  const i = info(key);
  fitAll(t);
  const im = await load(A + i.p.still);
  const c = document.createElement('canvas'); c.width = 32; c.height = 18;
  const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(im, 0, 0, 32, 18);
  const d = g.getImageData(0, 0, 32, 18).data; let r = 0, gg = 0, b = 0;
  for (let k = 0; k < d.length; k += 4) { r += d[k]; gg += d[k + 1]; b += d[k + 2]; }
  const n = d.length / 4;
  let [h, s, l] = rgbHsl(r / n / 255, gg / n / 255, b / n / 255);
  const [R1, G1, B1] = hslRgb(h, Math.max(s, .3), clamp(l * 1.7, .45, .72));
  t.style.setProperty('--glow', `rgb(${R1 * 255 | 0} ${G1 * 255 | 0} ${B1 * 255 | 0})`);
};

B.flap = async () => {};

// Sticker Pack: the lettering sticker (a thick white die-cut edge around dark type) and the cast sticker:
// the Vision cut-out grown by a blurred-and-thresholded alpha into a white backing, with a soft shadow;
// a still with no cut-out becomes a rectangular photo sticker
B.sticker = async (t, key) => {
  const i = info(key);
  for (const st of t.querySelectorAll('.stack')) {
    const [bw, bh] = st.dataset.box.split(',').map(Number);
    const fg = st.querySelector('.fg'), sh = st.querySelector('.sh');
    const fit = fitBox(fg, st.dataset.text, bw, bh, .95, +st.dataset.cap);
    for (const el of [fg, sh]) { el.innerHTML = fit.lines.map(esc).join('<br>'); el.style.fontSize = fit.size.toFixed(2) + 'cqw'; }
    const o = Math.max(.3, fit.size * .13), ring = [];
    for (let k = 0; k < 24; k++) { const a = k / 24 * Math.PI * 2; ring.push(`${(Math.cos(a) * o).toFixed(2)}cqw ${(Math.sin(a) * o).toFixed(2)}cqw 0 #fff`); }
    sh.style.textShadow = ring.join(',');
  }
  const cv = t.querySelector('canvas.full');
  const [W, H] = size(cv);
  const im = await load(A + i.p.still), cm = i.p.cut && i.p.area > .02 ? await load(A + i.p.cut) : null;
  const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
  const shape = mk(), pic = mk(), sx = shape.getContext('2d'), px = pic.getContext('2d');
  const B0 = W * .011;
  if (cm) {
    const iw = im.naturalWidth, ih = im.naturalHeight, [, by, , bh] = i.p.box.map(v => v / 100);
    const cover = Math.max(W / iw, H / ih);
    const sc = clamp(H * .86 / (bh * ih), cover * .8, cover * 1.7);
    const cx = (FX[key] ?? i.p.box[0] + i.p.box[2] / 2) / 100;
    const ox = W * .66 - cx * iw * sc, oy = by + bh > .95 ? H * 1.03 - (by + bh) * ih * sc : H * .5 - (by + bh / 2) * ih * sc;
    const ab = grab(cm, W, H, ox, oy, iw * sc, ih * sc, `blur(${B0.toFixed(1)}px)`);
    const sd = sx.createImageData(W, H);
    for (let n = 0; n < W * H; n++) { sd.data[n * 4] = sd.data[n * 4 + 1] = sd.data[n * 4 + 2] = 255; sd.data[n * 4 + 3] = ss(.05, .075, ab[n * 4 + 3] / 255) * 255; }
    sx.putImageData(sd, 0, 0);
    px.drawImage(im, ox, oy, iw * sc, ih * sc);
    px.globalCompositeOperation = 'destination-in';
    px.drawImage(cm, ox, oy, iw * sc, ih * sc);
  } else {
    const x = W * .36, y = H * .09, w = W * .58, h = H * .8, r = W * .02;
    const rr = (g, x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); };
    sx.fillStyle = '#fff'; rr(sx, x - B0, y - B0, w + 2 * B0, h + 2 * B0, r + B0);
    const [fx, fy] = focus(i), c = crop(im, w, h, fx, fy);
    px.save(); px.beginPath(); px.roundRect(x, y, w, h, r * .6); px.clip(); px.drawImage(im, x + c.x, y + c.y, c.w, c.h); px.restore();
  }
  const base = mk(), g = base.getContext('2d');
  g.save(); g.filter = `blur(${(W * .006).toFixed(1)}px) brightness(0)`; g.globalAlpha = .38; g.drawImage(shape, W * .004, W * .009); g.restore();

};
function paintSticker(el, t) {
  const s = el._stk; if (!s) return;
  const { W, H, base, shape, tmp, ctx } = s;
  ctx.clearRect(0, 0, W, H); ctx.drawImage(base, 0, 0);
  // vinyl gloss: a soft standing highlight, and a bright band that crosses on hover (off the sticker at t = 0)
  const x = tmp.getContext('2d');
  x.globalCompositeOperation = 'source-over'; x.clearRect(0, 0, W, H);
  const p = -.5 + 2 * t;
  const gr = x.createLinearGradient(W * (p - .3), 0, W * (p + .3), H * .6);
  gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(.45, 'rgba(255,255,255,.0)'); gr.addColorStop(.5, 'rgba(255,255,255,.55)'); gr.addColorStop(.55, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  const sg = x.createLinearGradient(0, 0, W * .5, H);
  sg.addColorStop(0, 'rgba(255,255,255,.22)'); sg.addColorStop(.5, 'rgba(255,255,255,0)');
  x.fillStyle = sg; x.fillRect(0, 0, W, H);
  if (t) { x.fillStyle = gr; x.fillRect(0, 0, W, H); }
  x.globalCompositeOperation = 'destination-in'; x.drawImage(shape, 0, 0);
  ctx.drawImage(tmp, 0, 0);
}

// Slate: the scene sits right of the board, zoomed a little so it can move without uncovering an edge
B.slate = async (t, key) => {
  const i = info(key);
  fitAll(t);
  const z = 1.2, wi = 100 * z, hi = 56.25 * z;
  const [fx, fy] = focus(i);
  const x = clamp(73 - fx * wi, 100 - wi, 12), y = clamp(26 - fy * hi, 56.25 - hi, 0);
  t.style.setProperty('--bs', `${wi}cqw auto`);
  t.style.setProperty('--bp', `${x.toFixed(2)}cqw ${y.toFixed(2)}cqw`);
};

/* ── motion: t in [0, 1); t = 0 is the still, and the loop closes ── */
const M = {};
M.mono = (el, t) => {
  paintMono(el, t);
  el.style.setProperty('--pz', (1 + .03 * Math.sin(t * Math.PI) ** 2).toFixed(4));
};
M.app = (el, t) => {
  el.style.setProperty('--pz', (1 + .07 * Math.sin(t * Math.PI) ** 2).toFixed(4));
  el.style.setProperty('--px', (-1.2 * Math.sin(t * Math.PI * 2)).toFixed(3) + 'cqw');
};
M.vhs = (el, t) => {
  el.querySelectorAll('.hub').forEach(g => g.setAttribute('transform', `rotate(${(t * 120).toFixed(2)} ${g.dataset.cx} 5.5)`));
  el.style.setProperty('--band', (-6 + 40 * t).toFixed(2) + 'cqw');
};
M.film = (el, t) => poseFilm(el, t);
M.gallery = (el, t) => {
  el.style.setProperty('--li', (1 + .1 * Math.sin(t * Math.PI * 2)).toFixed(3));
  el.style.setProperty('--vs', (130 - 160 * t).toFixed(1) + '%');
};

M.cine = (el, t) => {
  const a = t * Math.PI * 2;
  // projector flicker; 1 at t = 0, and the loop closes
  el.style.setProperty('--fl', (1 + .04 * Math.sin(a * 3) + .025 * (Math.sin(a * 7 + 1.3) - Math.sin(1.3))).toFixed(4));
  el.style.setProperty('--dy', (-t * 11.5).toFixed(3) + 'cqw');
};
const FLAPS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
M.flap = (el, t) => {
  // each flap shuffles for a while and lands back on its letter; frame 0 is the settled board
  const f = Math.round(t * 36);
  el.querySelectorAll('.c[data-ch]').forEach((c, n) => {
    const start = 1 + (n % 5) * .7, end = Math.min(31, 8 + n * .9);
    let show = c.dataset.ch, mid = false;
    if (f >= start && f < end) { const R = rng(el.dataset.key + ':' + n + ':' + f); show = FLAPS[Math.floor(R() * FLAPS.length)]; mid = R() < .5; }
    if (c.textContent !== show) c.textContent = show;
    c.classList.toggle('mid', mid);
  });
  el.style.setProperty('--pz', (1 + .04 * Math.sin(t * Math.PI) ** 2).toFixed(4));
};
M.sticker = (el, t) => {
  paintSticker(el, t);
  el.style.setProperty('--wob', (2.5 + .8 * Math.sin(t * Math.PI * 2)).toFixed(3) + 'deg');
};
M.slate = (el, t) => {
  // the sticks open, snap shut a little before halfway, and the board jolts
  let a = 0;
  if (t < .42) a = -24 * Math.sin(t / .42 * Math.PI / 2);
  else if (t < .46) a = -24 * (1 - (t - .42) / .04);
  el.style.setProperty('--clap', a.toFixed(2) + 'deg');
  const k = t > .46 && t < .62 ? Math.sin((t - .46) / .16 * Math.PI * 3) * (1 - (t - .46) / .16) : 0;
  el.style.setProperty('--jolt', (k * .4).toFixed(3) + 'cqw');
  el.style.setProperty('--pz', (1 + .035 * Math.sin(t * Math.PI) ** 2).toFixed(4));
};

async function build(root) {
  await sizeLogos(root);
  for (const t of root.querySelectorAll('.tile')) {
    await B[t.dataset.style](t, t.dataset.key);
    M[t.dataset.style](t, 0);
  }
}
window.setT = t => document.querySelectorAll('#render .tile').forEach(el => M[el.dataset.style](el, t));

const FONTS = ['200 100px "Inter Tight"', '600 100px "Inter Tight"', '750 100px "Inter Tight"', '900 100px "Inter Tight"', 'italic 900 100px Archivo', '800 100px Archivo', '600 100px Fraunces', 'italic 500 100px Fraunces', '400 100px "Lilita One"', '400 100px "Caveat Brush"'];
const ready = (document.fonts ? Promise.all(FONTS.map(f => document.fonts.load(f))).then(() => document.fonts.ready) : Promise.resolve());
const rm = location.hash.match(/^#r-(\w+)-([\w-]+)$/);
if (rm) {
  document.body.classList.add('render');
  const r = document.getElementById('render');
  r.innerHTML = tile(rm[1], rm[2]);
  ready.then(() => build(r)).then(() => { window.renderReady = true; }, e => { window.renderError = String(e && e.stack || e); });
} else {
  const q = new URLSearchParams(location.search), want = q.get('s'), keys = q.get('k');
  const styles = want ? want.split(',') : Object.keys(STYLES);
  const rows = keys ? [['Sample', keys.split(',')]] : window.ROWS;
  document.getElementById('sheet').innerHTML = styles.map(s => `<h1>${esc(STYLES[s])}</h1>` + rows.map(([title, ks]) =>
    `<h2>${esc(title)}</h2><div class="row">${ks.map(k => tile(s, k)).join('')}</div>`).join('')).join('');
  ready.then(() => build(document)).then(() => { window.renderReady = true; }, e => { window.renderError = String(e && e.stack || e); });
}
</script>
