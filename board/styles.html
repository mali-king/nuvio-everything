<style>

.pol .lamp { inset: 0; background: radial-gradient(62% 85% at 34% 38%, rgba(255,196,130,.32) 0%, rgba(255,170,100,.1) 45%, transparent 75%), radial-gradient(120% 120% at 34% 38%, transparent 40%, rgba(0,0,0,.65) 100%); opacity: var(--lamp, 1); }

/* sheet */
.sheet { padding: 24px 16px 60px; max-width: 1500px; margin: 0 auto; }
.sheet h2 { font-size: 18px; margin: 30px 0 10px; }
.sheet .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.sheet .tile { border-radius: 10px; }
body.render .sheet { display: none; }
body.render #render .tile { width: 100vw; height: 100vh; aspect-ratio: auto; }

function info(key) {

function crop(im, w, h, fx, fy, zoom = 1) {
  const sc = Math.max(w / im.naturalWidth, h / im.naturalHeight) * zoom;

/* ── measuring and fitting ── */
function measure(el, text, stretch) {
  const m = document.createElement('span');
  m.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font-size:100px;left:0;top:0;line-height:1';
  if (stretch) m.style.fontStretch = stretch + '%';
  m.textContent = text;
  el.appendChild(m);
  const w = m.getBoundingClientRect().width;
  m.remove();
  return w;
}
// Largest size at which text fits a box (cqw), trying one line and the best two-line split, and
// every width the font allows; ties go to the wider cut so the word fills its box.
function fitBox(el, text, bw, bh, lh, stretches = [null], cap = 999) {
  let best = null;
  for (const st of stretches) {
    const opts = [{ lines: [text], wd: measure(el, text, st) }];
    const words = text.split(' ');
    if (words.length > 1) {
      let b2 = null;
      for (let k = 1; k < words.length; k++) {
        const a = words.slice(0, k).join(' '), b = words.slice(k).join(' ');
        const wd = Math.max(measure(el, a, st), measure(el, b, st));
        if (!b2 || wd < b2.wd) b2 = { lines: [a, b], wd };
      }
      opts.push(b2);
    }
    for (const o of opts) {
      const size = Math.min(cap, bw * 100 / o.wd, bh / (o.lines.length * lh));
      const score = size * (o.lines.length === 1 ? 1.06 : 1) + (st || 0) / 1e4;
      if (!best || score > best.score) best = { score, size, lines: o.lines, stretch: st };
    }
  }
  return best;
}
function applyFit(el, fit, html) {
  el.innerHTML = html || fit.lines.map(esc).join('<br>');
  el.style.fontSize = fit.size.toFixed(2) + 'cqw';
  if (fit.stretch) el.style.fontStretch = fit.stretch + '%';
}
function fitAll(t) {
  t.querySelectorAll('.fit[data-box]').forEach(el => {
    const [bw, bh] = el.dataset.box.split(',').map(Number);
    const st = el.dataset.st ? el.dataset.st.split(',').map(Number) : [null];
    applyFit(el, fitBox(el, el.dataset.text, bw, bh, +el.dataset.lh, st, el.dataset.cap ? +el.dataset.cap : 999));
  });
}

// Logos are sized by area (cqw²), so a tall mark carries the same weight as a wide one.
const LOGO = { 'hype-top': { area: 220, h: 10, w: 30 }, 'hype-side': { area: 760, h: 18, w: 50 } };
async function logoSize(src, area, h, w) {
  const im = await load(src);
  const a = im.naturalWidth / im.naturalHeight;
  let lh = Math.min(h, Math.sqrt(area / a));
  if (lh * a > w) lh = w / a;
  return { h: lh, w: lh * a, a };
}
async function sizeLogos(root) {
  await Promise.all([...root.querySelectorAll('img.logo[data-slot]')].map(async img => {
    const { area, h, w } = LOGO[img.dataset.slot];
    const s = await logoSize(img.src, area, h, w);
    img.style.height = s.h.toFixed(2) + 'cqw';
    img.style.width = s.w.toFixed(2) + 'cqw';

B.arc = async (t, key) => {
  const i = info(key);
  const cv = t.querySelector('canvas.pix');
  const im = await load(A + i.p.still);
  const PW = 200, PH = 113;
  cv.width = PW; cv.height = PH;
  const ctx = cv.getContext('2d');
  const c = crop(im, PW, PH, ...focus(i), 1.06);
  ctx.filter = `saturate(1.35) contrast(1.15) brightness(${clamp(.4 / (i.p.lum || .3), 1, 2.2).toFixed(2)})`;
  ctx.drawImage(im, c.x, c.y, c.w, c.h);
  ctx.filter = 'none';
  const d = ctx.getImageData(0, 0, PW, PH), p = d.data;
  const pal = PICO.map(h => [1, 3, 5].map(k => parseInt(h.slice(k, k + 2), 16)));
  const bayer = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) {
    const j = (y * PW + x) * 4, o = (bayer[(y & 3) * 4 + (x & 3)] / 16 - .5) * 44;
    const r = p[j] + o, g = p[j + 1] + o, b = p[j + 2] + o;
    let best = 0, bd = 1e9;
    for (let k = 0; k < pal.length; k++) {
      const dr = r - pal[k][0], dg = g - pal[k][1], db = b - pal[k][2];
      const dd = dr * dr * .3 + dg * dg * .59 + db * db * .11;
      if (dd < bd) { bd = dd; best = k; }
    }
    p[j] = pal[best][0]; p[j + 1] = pal[best][1]; p[j + 2] = pal[best][2];
  }
  ctx.putImageData(d, 0, 0);

  for (const stack of t.querySelectorAll('.stack')) {

    const fg = stack.querySelector('.fg'), sh = stack.querySelector('.sh');
    const fit = fitBox(fg, stack.dataset.text, bw, bh, 1.12);
    applyFit(fg, fit); applyFit(sh, fit);

    const dk = getComputedStyle(t).getPropertyValue('--a3').trim();
    sh.style.textShadow = [[o, 0], [-o, 0], [0, o], [0, -o], [o, o], [-o, -o], [o, -o], [-o, o]].map(([x, y]) => `${x.toFixed(2)}cqw ${y.toFixed(2)}cqw 0 #000`).join(',')
      + `, 0 ${(o * 2.2).toFixed(2)}cqw 0 #000, ${(o * 1.1).toFixed(2)}cqw ${(o * 2.2).toFixed(2)}cqw 0 #000, 0 ${(o * 1.4).toFixed(2)}cqw 0 ${dk}`;
    fg.style.setProperty('--lh', (fit.size * 1.12).toFixed(2) + 'cqw');
  }
  // logos, pixelated: drawn tiny, outlined in black, then blown up without smoothing
  for (const pc of t.querySelectorAll('canvas.px')) {
    const [bw, bh] = pc.dataset.box.split(',').map(Number);
    const s = await logoSize(logoSrc(i.f), bw * bh * .7, bh, bw);
    const lw = Math.round(clamp(s.w * 2.1, 40, 130)), lhh = Math.max(8, Math.round(lw / s.a));
    pc.width = lw + 4; pc.height = lhh + 4;
    const lc = document.createElement('canvas'); lc.width = lw; lc.height = lhh;
    const lx = lc.getContext('2d'); lx.drawImage(await load(logoSrc(i.f)), 0, 0, lw, lhh);
    lx.globalCompositeOperation = 'source-in';
    const x = pc.getContext('2d'); x.imageSmoothingEnabled = false;
    lx.fillStyle = '#000'; lx.fillRect(0, 0, lw, lhh);
    for (const [dx, dy] of [[1, 2], [3, 2], [2, 1], [2, 3], [2, 4], [3, 4]]) x.drawImage(lc, dx, dy);
    lx.fillStyle = '#fff1e8'; lx.fillRect(0, 0, lw, lhh);

    const id = x.getImageData(0, 0, pc.width, pc.height);
    for (let k = 3; k < id.data.length; k += 4) id.data[k] = id.data[k] > 110 ? 255 : 0;
    x.putImageData(id, 0, 0);

    tt.querySelector('.ib').style.transform = 'translate(var(--mx, .55cqw), var(--my, .45cqw))';
    under = { x: parseFloat(tt.style.left), y: parseFloat(tt.style.top) + s.h + 1.6, w: s.w };
  } else {
    const ia = tt.querySelector('.ia');
    const hgt = fit.lines.length * fit.size * .84;
    under = { x: parseFloat(tt.style.left), y: parseFloat(tt.style.top) + hgt + 1.6, w: Math.min(colW, Math.max(...fit.lines.map(l => measure(ia, l, fit.stretch))) * fit.size / 100) };
  }
  if (!i.top) {
    const R = rng(key + 'scrib');
    const y = under.y, x0 = under.x - .5, x1 = under.x + under.w * .92;
    const wob = () => (R() - .5) * 1.2;
    const d1 = `M${x0} ${y + wob()} C ${x0 + (x1 - x0) * .3} ${y - 1.6 + wob()}, ${x0 + (x1 - x0) * .65} ${y + 1.6 + wob()}, ${x1} ${y - .6 + wob()}`;
    const d2 = `M${x0 + 2} ${y + 1.9 + wob()} C ${x0 + (x1 - x0) * .35} ${y + .6 + wob()}, ${x0 + (x1 - x0) * .7} ${y + 2.8 + wob()}, ${x1 - 3} ${y + 1.2 + wob()}`;
    t.querySelector('svg.scrib').innerHTML = `<path d="${d1}" fill="none" stroke="var(--b)" stroke-width=".85" stroke-linecap="round"/><path d="${d2}" fill="none" stroke="var(--b)" stroke-width=".6" stroke-linecap="round"/>`;
  }
};

// Torn-paper edges as a clip-path; step varies the tear for the stop-motion boil.
function tear(t, key, step) {
  t._torn.forEach((el, n) => {
    const R = rng(key + 'tear' + n + ':' + step);
    const pts = [], j = () => (R() - .5) * 1.6;
    for (let x = 0; x <= 100; x += 2.5) pts.push([x, 1 + j()]);
    for (let y = 2.5; y <= 100; y += 3) pts.push([99 + j(), y]);
    for (let x = 100; x >= 0; x -= 2.5) pts.push([x, 99 + j()]);
    for (let y = 97.5; y > 0; y -= 3) pts.push([1 + j(), y]);
    el.style.clipPath = `polygon(${pts.map(([x, y]) => `${x.toFixed(2)}% ${y.toFixed(2)}%`).join(',')})`;
  });
}

// Two-ink risograph print of a still: ink B carries the scene's mid-tones as a light texture, ink A the
// deep shadows plus the whole tonal range of the subject (the Vision cut-out), so the subject reads first.
// The crop zooms until the subject fills most of the frame; a still with no subject keeps its whole frame.
// A dark still is lifted (gamma on its tones) so it prints as a picture rather than a block of ink.
async function halftone(cv, src, cutSrc, box, mean, inkA, inkB) {
  const W = cv.width = Math.round(cv.clientWidth), H = cv.height = Math.round(cv.clientHeight);
  const im = await load(src), cm = cutSrc ? await load(cutSrc) : null;
  const [bx, by, bw, bh] = cm ? box.map(v => v / 100) : [0, 0, 1, 1];
  const cover = Math.max(W / im.naturalWidth, H / im.naturalHeight);
  const want = Math.min(H * .9 / (bh * im.naturalHeight), W * .95 / (bw * im.naturalWidth));
  const sc = clamp(want, cover * 1.04, cover * 2.2);
  const gam = clamp((mean || .3) / .3, .5, 1);
  const dw = im.naturalWidth * sc, dh = im.naturalHeight * sc;
  const ox = clamp(W / 2 - (bx + bw / 2) * dw, W - dw, 0), oy = clamp(H * .55 - (by + bh / 2) * dh, H - dh, 0);
  const cell = W / 50;
  const grab = (img, blur) => {
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d'); x.filter = `blur(${blur}px)`; x.drawImage(img, ox, oy, dw, dh);
    return x.getImageData(0, 0, W, H).data;
  };
  const px = grab(im, cell * .3), mk = cm ? grab(cm, cell * .5) : null;
  const L = new Float32Array(W * H), Mk = new Float32Array(W * H), hist = new Uint32Array(256);
  for (let n = 0; n < W * H; n++) {
    const v = .2126 * px[n * 4] + .7152 * px[n * 4 + 1] + .0722 * px[n * 4 + 2];
    L[n] = v; hist[v | 0]++; Mk[n] = mk ? mk[n * 4 + 3] / 255 : 0;
  }
  let acc = 0, lo = 0, hi = 255;
  for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc < W * H * .02) lo = v; if (acc < W * H * .985) hi = v; }
  const at = (arr, x, y) => arr[clamp(y | 0, 0, H - 1) * W + clamp(x | 0, 0, W - 1)];
  const dark = (x, y) => 1 - clamp((at(L, x, y) - lo) / Math.max(1, hi - lo), 0, 1) ** gam;
  const ss = (a, b, v) => { const k = clamp((v - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); };
  const ctx = cv.getContext('2d');
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#f3eee2'; ctx.fillRect(0, 0, W, H);
  const plate = (deg, c, cover, ink, shift) => {
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = ink;
    const th = deg * Math.PI / 180, cs = Math.cos(th), sn = Math.sin(th);
    const n = Math.ceil(Math.hypot(W, H) / c / 2) + 2;
    ctx.beginPath();
    for (let a = -n; a <= n; a++) for (let b = -n; b <= n; b++) {
      const x = W / 2 + (a * cs - b * sn) * c + shift, y = H / 2 + (a * sn + b * cs) * c + shift;
      if (x < -c || y < -c || x > W + c || y > H + c) continue;
      const k = cover(x, y);
      if (k < .02) continue;
      const rad = Math.min(c * .7, c * Math.sqrt(k / Math.PI));
      ctx.moveTo(x + rad, y); ctx.arc(x, y, rad, 0, Math.PI * 2);
    }
    ctx.fill();
  };
  // with no subject mask, ink A takes a little more of the mid-tones so the scene still has a figure
  const aLo = cm ? .5 : .38;
  plate(75, cell, (x, y) => .78 * ss(.05, .75, dark(x, y)) * (1 - .6 * at(Mk, x, y)), inkB, cell * .21);
  plate(15, cell, (x, y) => { const d = dark(x, y), m = at(Mk, x, y); return Math.max(.8 * ss(aLo, .95, d), m * (.18 + .82 * ss(.06, .8, d))); }, inkA, 0);
  ctx.globalCompositeOperation = 'source-over';
}

B.hype = async (t, key) => {
  const i = info(key);
  const el = t.querySelector('.lab .fit');
  if (el) {
    const [bw, bh] = el.dataset.box.split(',').map(Number);
    applyFit(el, fitBox(el, i.nc ? el.dataset.text : el.dataset.text.toUpperCase(), bw, bh, +el.dataset.lh, el.dataset.st.split(',').map(Number)));
  }
  // Frame the still so its subject sits on or right of the slash. The panel only shows the tile right of
  // x = 33%, so the photo can slide right by up to a third without uncovering anything. The cut-out breaks
  // out over the slash only when the subject is big enough and does not reach back across the colour panel,
  // where it would sit under the lettering.
  const [bx, by, bw, bh] = i.p.box, cx = FX[key] ?? bx + bw / 2;
  const shift = clamp(60 - cx, 0, 32);
  t.style.setProperty('--bs', '100% 100%');
  t.style.setProperty('--bp', `${shift.toFixed(1)}cqw 0`);
  const cut = t.querySelector('.cut');
  const breakOut = i.p.cut && i.p.area > .035 && bh > 38 && bx + shift > 25;
  if (!breakOut) cut.remove();
  t._rows = [...t.querySelectorAll('.echo .row')].map((row, n) => ({ row, unit: row.firstElementChild.getBoundingClientRect().width / (t.getBoundingClientRect().width / t.clientWidth), dir: +row.dataset.dir, base: -(n * 37 % 100) / 100 }));
  setRows(t, 0);
};
function setRows(t, p) {
  t._rows.forEach(({ row, unit, dir, base }) => row.style.setProperty('--ex', ((base + dir * p - (dir > 0 ? 1 : 0)) * unit).toFixed(1) + 'px'));
}

/* ── motion: t in [0, 1); t = 0 is the still, and the loop closes ── */
const M = {};
M.pol = (el, t) => {
  const a = t * Math.PI * 2;
  el.querySelectorAll('.frame, .note').forEach((f, n) => {
    const s = f.classList.contains('back') ? -.6 : 1;
    f.style.setProperty('--px', (Math.sin(a + n) * .35 * s).toFixed(3) + 'cqw');
    f.style.setProperty('--py', ((1 - Math.cos(a + n)) * .25 * s).toFixed(3) + 'cqw');
  });
  el.querySelectorAll('.glare').forEach(g => g.style.setProperty('--gl', (100 - 100 * t).toFixed(1) + '%'));
  el.style.setProperty('--lamp', (1 + .03 * Math.sin(a * 3)).toFixed(3));
};
M.arc = (el, t) => {
  el.style.setProperty('--blink', (t % .5) < .32 ? 1 : 0);
  // two roll bars half a loop apart, so one is always on screen
  el.querySelectorAll('.roll').forEach((r, n) => r.style.top = (-10 + ((t + n / 2) % 1) * 76).toFixed(2) + 'cqw');
  // the scanlines creep down one line a loop, so every frame differs (no frame merging) and the loop closes
  el.style.setProperty('--sc', (t * 1).toFixed(3) + 'cqw');
  el.style.setProperty('--bob', (Math.round(Math.sin(t * Math.PI * 4) * 2) * .25).toFixed(2) + 'cqw');
};
M.riso = (el, t) => {
  const step = Math.floor(t * 12) % 12;
  tear(el, el.dataset.key, step);
  const R = rng(el.dataset.key + 'boil' + step), j = s => step ? ((R() - .5) * s).toFixed(2) : 0;
  el.style.setProperty('--mx', (.55 + +j(.5)) + 'cqw');
  el.style.setProperty('--my', (.45 + +j(.5)) + 'cqw');
  // a slow continuous drift under the stepped boil, so no two frames are identical (an encoder would merge
  // them, and the iPhone plays every WebP frame at 100 ms whatever its duration)
  const dx = Math.sin(t * Math.PI * 2) * .5, dy = (1 - Math.cos(t * Math.PI * 2)) * .2;
  el.querySelector('canvas.half').style.translate = `${(+j(.4) + dx).toFixed(3)}cqw ${(+j(.4) + dy).toFixed(3)}cqw`;
  el.querySelector('.ttl').style.translate = `${(-dx * .4).toFixed(3)}cqw 0`;
  el.querySelector('canvas.half').style.rotate = `${j(.5)}deg`;
  el.querySelector('.blob').style.translate = `${j(.6)}cqw ${j(.6)}cqw`;
  const st = el.querySelector('.sticker');
  if (st) st.style.rotate = `${j(4)}deg`;
};
M.hype = (el, t) => {
  setRows(el, t);
  el.style.setProperty('--pz', (1 + .025 * Math.sin(t * Math.PI) ** 2).toFixed(4));
  const g = el.querySelector('svg.speed .sp');
  if (g) g.setAttribute('transform', `translate(${(t * 100).toFixed(2)} ${(-t * 21).toFixed(2)})`);
};

async function build(root) {
  await sizeLogos(root);
  for (const t of root.querySelectorAll('.tile')) {
    await B[t.dataset.style](t, t.dataset.key);
    M[t.dataset.style](t, 0);
  }
}
window.setT = t => document.querySelectorAll('#render .tile').forEach(el => M[el.dataset.style](el, t));

const FONTS = ['900 100px Archivo', 'italic 900 100px Archivo', '800 100px "Inter Tight"', '400 100px "Press Start 2P"', '400 100px "Permanent Marker"'];
const ready = (document.fonts ? Promise.all(FONTS.map(f => document.fonts.load(f))).then(() => document.fonts.ready) : Promise.resolve());
const rm = location.hash.match(/^#r-(\w+)-([\w-]+)$/);
if (rm) {
  document.body.classList.add('render');
  const r = document.getElementById('render');
  r.innerHTML = tile(rm[1], rm[2]);
  ready.then(() => build(r)).then(() => { window.renderReady = true; }, e => { window.renderError = String(e && e.stack || e); });
} else {
  const want = new URLSearchParams(location.search).get('s');
  const styles = want ? [want] : Object.keys(STYLES);
  document.getElementById('sheet').innerHTML = styles.map(s => `<h1>${esc(STYLES[s])}</h1>` + window.ROWS.map(([title, ks]) =>
    `<h2>${esc(title)}</h2><div class="row">${ks.map(k => tile(s, k)).join('')}</div>`).join('')).join('');
  ready.then(() => build(document));
}
</script>
